<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Incident - SportsPro Technical Support</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <h1>SportsPro Technical Support</h1>
      <p>Sports management software for the sports enthusiast</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <div class="main-panel">
      <div class="header-section">
        <h2>Create Incident</h2>
        <a href="index.html">Home</a>
      </div>
  
      <!-- Loading Indicator for Product Dropdown -->
      <div id="loadingIndicator" class="hidden">
        <p><em>Loading products...</em></p>
      </div>
  
      <!-- Create Incident Form -->
      <div class="form-panel">
        <div class="form-row">
          <div class="form-group">
            <label for="product">Product:</label>
            <select id="product" name="product">
              <option value="">-- Select a Product --</option>
            </select>
          </div>
        </div>
  
        <div class="form-group">
          <label for="title">Title:</label>
          <input type="text" id="title" name="title" placeholder="Brief description of the issue" />
        </div>
  
        <div class="form-group">
          <label for="description">Description:</label>
          <textarea id="description" name="description" rows="4" placeholder="Detailed description of the incident"></textarea>
        </div>
  
        <button id="createBtn" class="btn btn-primary">Create Incident</button>
  
        <!-- Loading Indicator for Create Submission -->
        <div id="createLoading" class="hidden">
          <p><em>Submitting incident...</em></p>
        </div>
      </div>
  
      <!-- Confirmation Message -->
      <div class="success-panel hidden" id="successPanel">
        <div class="alert alert-success">
          <p id="successMessage"></p>
        </div>
      </div>
    </div>
  </main>
  

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2025 SportsPro, Inc.</p>
    </div>
  </footer>

  <!-- JS -->
  <script type="module" src="js/create_incidents.js"></script>
</body>
</html>
