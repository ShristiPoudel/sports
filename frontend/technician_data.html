<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technician Profile - SportsPro</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1>SportsPro Technical Support</h1>
        <p>Technician Additional Information</p>
      </div>
    </header>

    <main class="container">
      <div class="main-panel small-panel">
        <div id="loadingIndicator" class="hidden">Loading....</div>
        <h2>Complete Your Technician Profile</h2>
        <form id="technicianForm">
          <div class="form-group">
            <label>First Name:</label
            ><input type="text" id="firstName" required />
          </div>
          <div class="form-group">
            <label>Last Name:</label
            ><input type="text" id="lastName" required />
          </div>
          <div class="form-group">
            <label>Phone:</label><input type="text" id="phone" required />
          </div>


          <button type="submit" class="btn btn-primary full-width">
          <div id="submitLoading" class="hidden">Submitting profile...</div>
            Submit
          </button>
        </form>
      </div>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2025 SportsPro, Inc.</p>
      </div>
    </footer>

    <script type="module" src="js/technician_data.js"></script>
  </body>
</html>
