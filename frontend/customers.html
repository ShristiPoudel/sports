<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Customers - SportsPro Technical Support</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <h1>SportsPro Technical Support</h1>
      <p>Sports management software for the sports enthusiast</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <div class="main-panel">
      <div class="header-section">
        <h2>Customer List</h2>
        <a href="index.html">Home</a>
      </div>

      <!-- Customers Table -->
      <div class="table-container mb-4">
        <table>
          <thead>
            <tr>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="customerTableBody">
            <!-- Dynamic content will be rendered by customers.js -->
          </tbody>
        </table>
      </div>

      <!-- Add Customer Form -->
      <div class="form-panel">
        <h3>Add Customer</h3>
        <form id="customerForm">
          <div class="form-group">
            <label for="addFirstName">First Name:</label>
            <input type="text" id="addFirstName" name="firstName" required />
          </div>

          <div class="form-group">
            <label for="addLastName">Last Name:</label>
            <input type="text" id="addLastName" name="lastName" required />
          </div>

          <div class="form-group">
            <label for="addEmail">Email:</label>
            <input type="email" id="addEmail" name="email" required />
          </div>

          <div class="form-group">
            <label for="addPhone">Phone:</label>
            <input type="tel" id="addPhone" name="phone" required />
          </div>

          <div class="form-group">
            <label for="addAddress">Address:</label>
            <input type="text" id="addAddress" name="address" required />
          </div>

          <div class="form-group">
            <label for="addCity">City:</label>
            <input type="text" id="addCity" name="city" required />
          </div>

          <div class="form-group">
            <label for="addState">State:</label>
            <input type="text" id="addState" name="state" required />
          </div>

          <div class="form-group">
            <label for="addPostalCode">Postal Code:</label>
            <input type="text" id="addPostalCode" name="postalCode" required />
          </div>

          <div class="form-group">
            <label for="addCountry">Country:</label>
            <select id="addCountry" name="countryCode" required>
              <option value="">Loading countries...</option>
            </select>            
          </div>

          <div class="form-group">
            <label for="addPassword">Password:</label>
            <input type="password" id="addPassword" name="password" required />
          </div>

          <button type="submit" class="btn btn-primary">Add Customer</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2025 SportsPro, Inc.</p>
    </div>
  </footer>

  <!-- JS file -->
  <script type="module" src="js/customers.js"></script>
</body>
</html>
