<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration - SportsPro</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>SportsPro Technical Support</h1>
      <p>Sports management software for the sports enthusiast</p>
    </div>
  </header>

  <main class="container">
    <div class="main-panel small-panel">
      <div class="header-section">
        <h2>User Registration</h2>
        <a href="index.html">Home</a>
      </div>

      <form id="registrationForm">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required />
        </div>
        <div class="form-group">
          <label for="role">Role:</label>
          <select id="role" name="role" required>
            <option value="">-- Select Role --</option>
            <option value="technician">Technician</option>
            <option value="customer">Customer</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary full-width">Register</button>
        <div id="registerLoading" class="loading-indicator hidden">Registering user...</div>

      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 SportsPro, Inc.</p>
    </div>
  </footer>

  <script src="js/register.js"></script>
</body>
</html>
