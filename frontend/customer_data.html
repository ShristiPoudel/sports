<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Profile - SportsPro</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <h1>SportsPro Technical Support</h1>
        <p>Customer Additional Information</p>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container">
      <div class="main-panel small-panel">
        <div class="header-section">
          <h2>Complete Your Customer Profile</h2>
          <a href="logout.html">Home</a>
        </div>
        <div id="loadingIndicator" class="hidden">
          Loading, please wait...
        </div>

        <form id="customerForm">
          <div class="form-group">
            <label>First Name:</label
            ><input type="text" id="firstName" required />
          </div>
          <div class="form-group">
            <label>Last Name:</label
            ><input type="text" id="lastName" required />
          </div>
          <div class="form-group">
            <label>Address:</label><input type="text" id="address" />
          </div>
          <div class="form-group">
            <label>City:</label><input type="text" id="city" />
          </div>
          <div class="form-group">
            <label>State:</label><input type="text" id="state" />
          </div>
          <div class="form-group">
            <label>Postal Code:</label><input type="text" id="postalCode" />
          </div>
          <div class="form-group">
            <label>Phone:</label><input type="text" id="phone" />
          </div>
          
          <div class="form-group">
            <label>CountryCode:</label><input type="text" id="countryCode" />
          </div>
           
          <button type="submit" class="btn btn-primary full-width">
            Submit
          </button>
            <!-- Submit loading indicator -->
            <div id="submitLoading" class="hidden">Submitting your profile...</div>
        </form>
      </div>
    </main>
<!-- Footer -->
    <footer>
      <div class="container">
        <p>&copy; 2025 SportsPro, Inc.</p>
      </div>
    </footer>

    <script type="module" src="js/customer_data.js"></script>
  </body>
</html>
