<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Incident - SportsPro Technical Support</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1>SportsPro Technical Support</h1>
            <p>Sports management software for the sports enthusiast</p>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="container">
        <div class="main-panel">
            <div class="header-section">
                <h2>Assign Incident</h2>
                <a href="index.html">Home</a>
            </div>
            
            <!-- Unassigned Incidents List -->
            <div class="incidents-panel mb-4">
                <h3>Select Incident</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Customer</th>
                                <th>Product</th>
                                <th>Date Opened</th>
                                <th>Title</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Incident Assignment Form  -->
            <div class="assignment-panel">
                <h3>Assign to Technician</h3>
                
                <div class="incident-details mb-4">
                    <div class="detail-row">
                        <div class="detail-label">Incident ID:</div>
                        <div class="detail-value" id="incID"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Customer:</div>
                        <div class="detail-value" id="incCustomer"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Product:</div>
                        <div class="detail-value" id="incProduct"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Date Opened:</div>
                        <div class="detail-value" id="incDate"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Title:</div>
                        <div class="detail-value" id="incTitle"></div>
                    </div>
                    <div class="detail-row full-width">
                        <div class="detail-label">Description:</div>
                        <div class="detail-value description-box" id="incDescription">
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="technician">Technician:</label>
                    <select id="technician" name="technician">
                        <option value="">-- Select a Technician --</option>
                    </select>
                </div>
                
                <div class="button-group">
                    <button  id="assignBtn" class="btn btn-primary">Assign Incident</button>
                    <button   id="cancelBtn" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2025 SportsPro, Inc.</p>
        </div>
    </footer>


    <script src="js/assign_incidents.js"></script>
</body>
</html>
