<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Assigned Incidents - SportsPro Technical Support</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <h1>SportsPro Technical Support</h1>
        <p>Sports management software for the sports enthusiast</p>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container">
      <div class="main-panel">
        <h2>Your Assigned Incidents</h2>

        <!-- Loading Indicator -->
        <div id="assignedLoading" class="loading-indicator hidden">
          Loading assigned incidents...
        </div>

        <table id="assigned-incidents-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Description</th>
              <th>Customer ID</th>
              <th>Date Opened</th>
            </tr>
          </thead>
          <tbody>
            <!-- Incident rows will be dynamically added here -->
          </tbody>
        </table>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <div class="container">
        <p>&copy; 2025 SportsPro, Inc.</p>
      </div>
    </footer>

    <script type="module" src="js/technician_assigned.js"></script>
  </body>
</html>
