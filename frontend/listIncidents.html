<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Incident List - SportsPro</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <h1>SportsPro Technical Support</h1>
      <p>Sports management software for the sports enthusiast</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <div class="main-panel">
      <div class="header-section">
        <h2>Incident List</h2>
        <a href="index.html">Home</a>
      </div>

      <!-- Incidents Table -->
      <div class="incidents-panel mb-4">
        <h3>All Incidents</h3>
        <div id="loadingIndicator" class="hidden">Loading incidents, please wait...</div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Product</th>
                <th>Technician</th>
                <th>Date Opened</th>
                <th>Date Closed</th>
                <th>Title</th>
              </tr>
            </thead>
            <tbody id="incidentsTableBody">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2025 SportsPro, Inc.</p>
    </div>
  </footer>

  <script type="module" src="js/listIncidents.js"></script>
</body>
</html>
