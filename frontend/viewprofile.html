<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>View Profile</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>SportsPro Technical Support</h1>
      <p>Sports management software for the sports enthusiast</p>
    </div>
  </header>

  <main class="container">
    <div class="main-panel small-panel">
      <div id="loadingIndicator" class="loading-message hidden">Loading profile...</div>
      <h2>Your Profile</h2>
    
      <div id="profileDetails" class="incident-details">
        <div class="detail-row">
          <label class="detail-label">Username:</label>
          <span id="username" class="detail-value"></span>
        </div>
        <div class="detail-row">
          <label class="detail-label">Email:</label>
          <span id="email" class="detail-value"></span>
        </div>
        <div class="detail-row">
          <label class="detail-label">Role:</label>
          <span id="role" class="detail-value"></span>
        </div>
    
        <!-- Additional (hidden initially) -->
        <div id="customerFields" class="hidden">
          <div class="detail-row"><label>First Name:</label><span id="firstName"></span></div>
          <div class="detail-row"><label>Last Name:</label><span id="lastName"></span></div>
          <div class="detail-row"><label>Phone:</label><span id="phone"></span></div>
          <div class="detail-row"><label>Address:</label><span id="address"></span></div>
          <div class="detail-row"><label>City:</label><span id="city"></span></div>
          <div class="detail-row"><label>State:</label><span id="state"></span></div>
          <div class="detail-row"><label>Postal Code:</label><span id="postalCode"></span></div>
          <div class="detail-row"><label>Country Code:</label><span id="countryCode"></span></div>
        </div>
    
        <div id="technicianFields" class="hidden">
          <div class="detail-row"><label>First Name:</label><span id="techFirstName"></span></div>
          <div class="detail-row"><label>Last Name:</label><span id="techLastName"></span></div>
          <div class="detail-row"><label>Phone:</label><span id="techPhone"></span></div>
        </div>
      </div>
    </div>
    
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 SportsPro, Inc.</p>
    </div>
  </footer>

 <script  type="module" src="js/viewprofile.js"></script>
</body>
</html>
