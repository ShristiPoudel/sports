<!-- login_user.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - SportsPro</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>SportsPro Technical Support</h1>
      <p>Sports management software for the sports enthusiast</p>
    </div>
  </header>

  <main class="container">
    <div class="main-panel small-panel">
      <div class="header-section">
        <h2>Login</h2>
        <a href="register_users.html">Don't have an account? Register here</a>
      </div>

      <div class="login-panel mb-4">
        <p>Please login to continue.</p>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" placeholder="Enter your password" />
        </div>

        <button class="btn btn-primary full-width" id="loginBtn">Login</button>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 SportsPro, Inc.</p>
    </div>
  </footer>

  <script type="module" src="js/login.js"></script>
</body>
</html>
