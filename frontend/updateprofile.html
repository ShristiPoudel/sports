<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Update Profile - SportsPro</title>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>SportsPro Technical Support</h1>
      <p>Sports management software for the sports enthusiast</p>
    </div>
  </header>

  <main class="container">
   

    <div class="main-panel">
      <div id="loadingIndicator" class="loading-message hidden">Loading...</div>
      <div class="header-section">
        <h2>Update Your Profile</h2>
        <a href="index.html">Home</a>
      </div>

      <div class="form-panel">
        <h3>User Information</h3>

        <div class="form-row">
          <div class="form-group">
            <label for="userName">User Name:</label>
            <input type="text" id="userName" name="userName" />
          </div>


        <div class="form-row">
          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" />
          </div>

          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Leave blank to keep current password" />
          </div>
        </div>

        <div class="button-group">
          <button class="btn btn-primary">Update User</button>
          <button class="btn btn-secondary" type="button">Cancel</button>
        </div>
      </div>
      <div id="submitLoading" class="submit-indicator hidden">Updating, please wait...</div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 SportsPro, Inc.</p>
    </div>
  </footer>

  <script type="module" src="js/updateprofile.js"></script>
</body>
</html>
