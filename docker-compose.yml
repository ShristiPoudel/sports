version: '3.8'

services:
  db:
    image: postgres:14
    container_name: new-db
    environment:
      POSTGRES_DB: new
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - new-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend1:
    build: ./backend
    container_name: new-backend1
    env_file:
      - ./backend/.env
    ports:
      - "3001:8001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - new-net

  backend2:
    build: ./backend
    container_name: new-backend2
    env_file:
      - ./backend/.env
    ports:
      - "3002:8001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - new-net

  backend3:
    build: ./backend
    container_name: new-backend3
    env_file:
      - ./backend/.env
    ports:
      - "3003:8001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - new-net

  nginx:
    image: nginx:alpine
    container_name: new-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - new-net

networks:
  new-net:
    driver: bridge
